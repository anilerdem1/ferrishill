<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ferrishill Capital</title>
  <meta name="description" content="Ferrishill Capital — website coming soon." />
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0d1826;
      --bg2: #0a1220;
      --ink: #eef2f7;
      --muted: #9fb0c3;
      --accent: #c9a24a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(201,162,74,0.10), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 1.6rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(2.1rem, 6vw, 3.6rem);
      letter-spacing: 0.16em;
      margin: 0;
      line-height: 1.15;
    }
    .rule {
      width: 56px;
      height: 1px;
      background: var(--accent);
      margin: 1.8rem auto;
      opacity: 0.8;
    }
    .tagline {
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      letter-spacing: 0.02em;
      margin: 0 auto 2.4rem;
      max-width: 30rem;
      line-height: 1.6;
    }
    .contact {
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .contact a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(201,162,74,0.5);
      padding-bottom: 1px;
      transition: border-color 0.2s ease;
    }
    .contact a:hover { border-color: var(--accent); }
    footer {
      position: fixed;
      bottom: 1.4rem;
      left: 0; right: 0;
      color: rgba(159,176,195,0.55);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Coming Soon</p>
    <h1>FERRISHILL&nbsp;CAPITAL</h1>
    <div class="rule"></div>
    <p class="tagline">Our website is on its way.</p>
    <p class="contact">For inquiries: <a href="mailto:info@ferrishill.com">info@ferrishill.com</a></p>
  </main>
  <footer>&copy; 2026 Ferrishill Capital</footer>
</body>
</html>
